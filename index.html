
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill #2</title>

    <!-- my bootstrap styling-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- my python helper-->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #4a3958;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin-top: 70px;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: #4a3958;
        }

        .btn-primary {
            background-color: #604477;
            border-color: #604477;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-container">

            <h1 class="text-center mb-4">Add a New ICT Club Member</h1>

            <!-- the first name of the new memmber to be added-->
            <div class="mb-3">
                <label for="fname" class="form-label fw-semibold">First Name</label>
                <input type="text" class="form-control" id="fname" placeholder="Enter first name">
            </div>

            <!-- the last name of the new memmber to be added-->
            <div class="mb-3">
                <label for="lname" class="form-label fw-semibold">Last Name</label>
                <input type="text" class="form-control" id="lname" placeholder="Enter last name">
            </div>

            <!-- my button to add new memberss-->
            <button type="button" class="btn btn-primary w-100" py-click="add_member">Add the New Member</button>

            <p id="message" class="text-center mt-3"></p>
            <div id="result" class="mt-3"></div>

        </div>
    </div>

    <!-- my python script source coming from main.py -->
    <py-script src="main.py"></py-script>
</body>
</html>
